name: Enhanced CI/CD Pipeline with Real-time Feedback

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

env:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Xmx1024m -XX:MaxPermSize=128m"
  JAVA_OPTS: "-Xmx1024m"

jobs:
  # 预检查阶段 - 快速失败
  pre-check:
    name: "🔍 Pre-check & Validation"
    runs-on: ubuntu-latest
    outputs:
      should-run-tests: ${{ steps.changes.outputs.should-run }}
      branch-name: ${{ steps.branch.outputs.name }}
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
    
    - name: "🌿 Get Branch Name"
      id: branch
      run: |
        echo "name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        echo "📍 Current branch: ${GITHUB_REF#refs/heads/}"
    
    - name: "🔄 Check for Changes"
      id: changes
      run: |
        if git diff --name-only HEAD~1 HEAD | grep -E '\.(java|xml|yml|yaml|properties)$'; then
          echo "should-run=true" >> $GITHUB_OUTPUT
          echo "✅ Code changes detected, will run full pipeline"
        else
          echo "should-run=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No significant code changes, skipping tests"
        fi
    
    - name: "📊 Send Pre-check Status"
      run: |
        echo "::notice title=Pre-check Complete::Branch: ${GITHUB_REF#refs/heads/}, Changes: ${{ steps.changes.outputs.should-run }}"

  # 编译和基础验证
  compile:
    name: "🔨 Compile & Basic Validation"
    runs-on: ubuntu-latest
    needs: pre-check
    if: needs.pre-check.outputs.should-run-tests == 'true'
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
    
    - name: "☕ Setup Java 17"
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: "🔧 Validate Maven Configuration"
      run: |
        echo "🔍 Validating Maven setup..."
        mvn help:effective-pom -q
        mvn dependency:resolve-sources -q
        echo "✅ Maven configuration is valid"
    
    - name: "🏗️ Compile Project"
      run: |
        echo "🔨 Starting compilation..."
        mvn clean compile -B -q
        echo "✅ Compilation successful"
    
    - name: "📊 Compilation Status"
      if: always()
      run: |
        if [ $? -eq 0 ]; then
          echo "::notice title=Compilation Success::✅ Project compiled successfully"
        else
          echo "::error title=Compilation Failed::❌ Compilation failed, check logs above"
          exit 1
        fi

  # 单元测试阶段
  unit-tests:
    name: "🧪 Unit Tests & Coverage"
    runs-on: ubuntu-latest
    needs: [pre-check, compile]
    if: needs.pre-check.outputs.should-run-tests == 'true'
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
    
    - name: "☕ Setup Java 17"
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: "🔍 Wait for Services"
      run: |
        echo "⏳ Waiting for MySQL and Redis to be ready..."
        timeout 60 bash -c 'until mysqladmin ping -h localhost --silent; do sleep 1; done'
        timeout 60 bash -c 'until redis-cli -h localhost ping; do sleep 1; done'
        echo "✅ All services are ready"
    
    - name: "🧪 Run Unit Tests"
      run: |
        echo "🚀 Starting unit tests..."
        mvn test -B \
          -Dspring.profiles.active=test \
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/test_db \
          -Dspring.datasource.username=test \
          -Dspring.datasource.password=test \
          -Dspring.data.redis.host=localhost \
          -Dspring.data.redis.port=6379 \
          -Dmaven.test.failure.ignore=false
    
    - name: "📊 Generate Coverage Report"
      if: always()
      run: |
        echo "📈 Generating test coverage report..."
        mvn jacoco:report -B
    
    - name: "📤 Upload Coverage to Codecov"
      if: always()
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./target/site/jacoco/jacoco.xml
        fail_ci_if_error: false
        verbose: true
    
    - name: "📋 Test Results Summary"
      if: always()
      run: |
        if [ -f target/surefire-reports/TEST-*.xml ]; then
          echo "📊 Test Results Summary:"
          find target/surefire-reports -name "TEST-*.xml" -exec grep -l "failures=\"0\"" {} \; | wc -l | xargs echo "✅ Passed test files:"
          find target/surefire-reports -name "TEST-*.xml" -exec grep -l "failures=\"[^0]" {} \; | wc -l | xargs echo "❌ Failed test files:"
          
          # 提取失败的测试
          if find target/surefire-reports -name "TEST-*.xml" -exec grep -l "failures=\"[^0]" {} \; | head -1 > /dev/null; then
            echo "::error title=Test Failures::Some tests failed, check the detailed logs"
            echo "🔍 Failed test details:"
            find target/surefire-reports -name "TEST-*.xml" -exec grep -A 5 -B 5 "<failure" {} \;
          else
            echo "::notice title=All Tests Passed::✅ All unit tests passed successfully"
          fi
        else
          echo "::warning title=No Test Results::No test result files found"
        fi
    
    - name: "📤 Upload Test Results"
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ github.run_number }}
        path: |
          target/surefire-reports/
          target/site/jacoco/
        retention-days: 30

  # 代码质量分析
  code-quality:
    name: "🔍 Code Quality Analysis"
    runs-on: ubuntu-latest
    needs: [pre-check, compile]
    if: needs.pre-check.outputs.should-run-tests == 'true'
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: "☕ Setup Java 17"
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: "🔍 SonarCloud Analysis"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          echo "🚀 Starting SonarCloud analysis..."
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=JamesWuVip_wanli-backend \
            -Dsonar.organization=jameswuvip \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          echo "✅ SonarCloud analysis completed"
        else
          echo "::warning title=SonarCloud Skipped::SONAR_TOKEN not configured"
        fi
    
    - name: "🛡️ OWASP Dependency Check"
      run: |
        echo "🔒 Running OWASP dependency security scan..."
        mvn org.owasp:dependency-check-maven:check -B
        echo "✅ Security scan completed"
      continue-on-error: true
    
    - name: "📤 Upload Security Reports"
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: security-reports-${{ github.run_number }}
        path: |
          target/dependency-check-report.html
          target/dependency-check-report.xml
        retention-days: 30

  # 集成测试
  integration-tests:
    name: "🔗 Integration Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality]
    if: needs.pre-check.outputs.should-run-tests == 'true' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: integration_test_db
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
    
    - name: "☕ Setup Java 17"
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: "🔗 Run Integration Tests"
      run: |
        echo "🚀 Starting integration tests..."
        mvn verify -Pintegration-tests -B \
          -Dspring.profiles.active=integration \
          -Dspring.datasource.url=jdbc:mysql://localhost:3306/integration_test_db \
          -Dspring.datasource.username=test \
          -Dspring.datasource.password=test
        echo "✅ Integration tests completed"

  # 实时反馈和通知
  feedback-notification:
    name: "📢 Real-time Feedback"
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality]
    if: always() && needs.pre-check.outputs.should-run-tests == 'true'
    
    steps:
    - name: "📊 Collect Pipeline Results"
      run: |
        echo "📋 Pipeline Execution Summary:"
        echo "Branch: ${{ needs.pre-check.outputs.branch-name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Code Quality: ${{ needs.code-quality.result }}"
        
        # 创建状态报告
        if [ "${{ needs.unit-tests.result }}" = "success" ] && [ "${{ needs.code-quality.result }}" = "success" ]; then
          echo "overall_status=success" >> $GITHUB_ENV
          echo "status_emoji=✅" >> $GITHUB_ENV
          echo "status_message=All checks passed successfully!" >> $GITHUB_ENV
        else
          echo "overall_status=failure" >> $GITHUB_ENV
          echo "status_emoji=❌" >> $GITHUB_ENV
          echo "status_message=Some checks failed, please review the logs" >> $GITHUB_ENV
        fi
    
    - name: "📱 Send Status Notification"
      run: |
        echo "::notice title=Pipeline Status::${{ env.status_emoji }} ${{ env.status_message }}"
        echo "📊 Detailed Results:"
        echo "  • Unit Tests: ${{ needs.unit-tests.result }}"
        echo "  • Code Quality: ${{ needs.code-quality.result }}"
        echo "  • Branch: ${{ needs.pre-check.outputs.branch-name }}"
        echo "  • Commit: ${{ github.sha }}"
        
        # 如果有失败，提供调试建议
        if [ "${{ env.overall_status }}" = "failure" ]; then
          echo "🔧 Debugging Suggestions:"
          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "  • Check unit test failures in the test results artifact"
            echo "  • Review test logs for specific error messages"
            echo "  • Ensure all dependencies are properly configured"
          fi
          if [ "${{ needs.code-quality.result }}" != "success" ]; then
            echo "  • Review SonarCloud analysis results"
            echo "  • Check for security vulnerabilities in dependencies"
            echo "  • Address code quality issues identified"
          fi
        fi

  # 自动化部署
  deploy-dev:
    name: "🚀 Deploy to Development"
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality, feedback-notification]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push' && needs.unit-tests.result == 'success'
    environment: development
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
    
    - name: "☕ Setup Java 17"
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: "🏗️ Build Application"
      run: |
        echo "🔨 Building application for development..."
        mvn clean package -DskipTests -Pdev
        echo "✅ Build completed"
    
    - name: "🚀 Deploy to Development Environment"
      run: |
        echo "🚀 Deploying to development environment..."
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "✅ Development deployment completed"
        echo "::notice title=Deployment Success::🚀 Successfully deployed to development environment"

  deploy-staging:
    name: "🎭 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality, integration-tests]
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push' && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'
    environment: staging
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
    
    - name: "☕ Setup Java 17"
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: "🏗️ Build Application"
      run: |
        echo "🔨 Building application for staging..."
        mvn clean package -DskipTests -Pstaging
        echo "✅ Build completed"
    
    - name: "🎭 Deploy to Staging Environment"
      run: |
        echo "🚀 Deploying to staging environment..."
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "✅ Staging deployment completed"
        echo "::notice title=Deployment Success::🎭 Successfully deployed to staging environment"

  deploy-production:
    name: "🏭 Deploy to Production"
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'
    environment: production
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
    
    - name: "☕ Setup Java 17"
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'
    
    - name: "🏗️ Build Application"
      run: |
        echo "🔨 Building application for production..."
        mvn clean package -DskipTests -Pprod
        echo "✅ Build completed"
    
    - name: "🏭 Deploy to Production Environment"
      run: |
        echo "🚀 Deploying to production environment..."
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
        echo "✅ Production deployment completed"
        echo "::notice title=Deployment Success::🏭 Successfully deployed to production environment"

  # 自动化调试和优化
  auto-debug:
    name: "🔧 Auto Debug & Optimization"
    runs-on: ubuntu-latest
    needs: [unit-tests, code-quality]
    if: always() && (needs.unit-tests.result == 'failure' || needs.code-quality.result == 'failure')
    
    steps:
    - name: "📥 Checkout Code"
      uses: actions/checkout@v4
    
    - name: "🔍 Analyze Failures"
      run: |
        echo "🔧 Starting automated failure analysis..."
        
        # 分析测试失败
        if [ "${{ needs.unit-tests.result }}" = "failure" ]; then
          echo "❌ Unit tests failed - analyzing..."
          echo "::error title=Test Failure Analysis::Unit tests failed, check test logs for details"
          
          # 提供自动化修复建议
          echo "🔧 Automated Fix Suggestions:"
          echo "1. Check for missing dependencies in pom.xml"
          echo "2. Verify database connection settings"
          echo "3. Ensure all required environment variables are set"
          echo "4. Check for syntax errors in test files"
        fi
        
        # 分析代码质量问题
        if [ "${{ needs.code-quality.result }}" = "failure" ]; then
          echo "❌ Code quality checks failed - analyzing..."
          echo "::error title=Quality Failure Analysis::Code quality checks failed, review SonarCloud results"
          
          echo "🔧 Automated Quality Improvements:"
          echo "1. Review SonarCloud dashboard for specific issues"
          echo "2. Address security vulnerabilities in dependencies"
          echo "3. Fix code smells and maintainability issues"
          echo "4. Improve test coverage to meet quality gates"
        fi
    
    - name: "📝 Generate Debug Report"
      run: |
        echo "📋 Creating automated debug report..."
        
        cat > debug-report.md << EOF
        # 🔧 Automated Debug Report
        
        **Pipeline Run:** ${{ github.run_number }}
        **Branch:** ${{ github.ref }}
        **Commit:** ${{ github.sha }}
        **Timestamp:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        
        ## 📊 Failure Summary
        
        - Unit Tests: ${{ needs.unit-tests.result }}
        - Code Quality: ${{ needs.code-quality.result }}
        
        ## 🔍 Recommended Actions
        
        ### If Unit Tests Failed:
        1. Download test results artifact from this run
        2. Review failed test logs in target/surefire-reports/
        3. Check database connectivity and test data setup
        4. Verify all test dependencies are available
        
        ### If Code Quality Failed:
        1. Visit SonarCloud dashboard: https://sonarcloud.io/project/overview?id=JamesWuVip_wanli-backend
        2. Address critical and major issues first
        3. Update dependencies with known vulnerabilities
        4. Improve test coverage for new code
        
        ## 🚀 Next Steps
        
        1. Fix the identified issues
        2. Commit and push changes to trigger new pipeline
        3. Monitor the pipeline results in real-time
        4. Review deployment status after successful checks
        
        ---
        *This report was generated automatically by the CI/CD pipeline*
        EOF
        
        echo "✅ Debug report generated"
    
    - name: "📤 Upload Debug Report"
      uses: actions/upload-artifact@v3
      with:
        name: debug-report-${{ github.run_number }}
        path: debug-report.md
        retention-days: 30
    
    - name: "🔔 Debug Notification"
      run: |
        echo "::notice title=Auto Debug Complete::🔧 Automated debug analysis completed, check the debug report artifact"
        echo "📋 Debug report available as artifact: debug-report-${{ github.run_number }}"
        echo "🔍 Review the suggestions and apply fixes to resolve the issues"