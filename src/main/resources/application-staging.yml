# 测试环境配置
spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://${DB_HOST:staging-db}:${DB_PORT:3306}/${DB_NAME:wanli_staging}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:staging_user}
    password: ${DB_PASSWORD:staging_password}
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  # 缓存配置
  cache:
    type: redis
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:staging-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:staging_redis_password}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # 邮件配置
  mail:
    host: ${SPRING_MAIL_HOST:smtphz.qiye.163.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:wuning@wanli.ai}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          ssl:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:true}
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}

# 服务器配置
server:
  port: ${SERVER_PORT:8080}

# 日志配置
logging:
  level:
    root: info
    com.wanli: info
  file:
    name: ${LOG_FILE_PATH:/var/log/wanli-backend/application.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
      max-history: ${LOG_MAX_HISTORY:30}

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

# JWT配置
jwt:
  secret: ${JWT_SECRET:staging-jwt-secret-key-change-in-production}
  expiration: ${JWT_EXPIRATION:86400000}