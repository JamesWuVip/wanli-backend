# 测试环境配置
spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://staging-db:3306/wanli_staging?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: staging_user
    password: staging_password
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  # 缓存配置
  cache:
    type: redis
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:staging-redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:staging_redis_password}
      database: ${REDIS_DATABASE:0}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 服务器配置
server:
  port: 8080

# 日志配置
logging:
  level:
    root: info
    com.wanli: info
  file:
    name: /var/log/wanli-backend/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true