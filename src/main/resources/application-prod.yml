# 生产环境配置
spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://prod-db:3306/wanli_prod?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  
  # 缓存配置
  cache:
    type: redis
  
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  # 邮件配置
  mail:
    host: ${SPRING_MAIL_HOST:smtphz.qiye.163.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:wuning@wanli.ai}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          ssl:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE:true}
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}

# 服务器配置
server:
  port: 8080
  compression:
    enabled: true
  http2:
    enabled: true

# 日志配置
logging:
  level:
    root: warn
    com.wanli: info
  file:
    name: /var/log/wanli-backend/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 60
      total-size-cap: 10GB

# 管理端点配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true

# JWT配置
jwt:
  secret: ${JWT_SECRET:prod-jwt-secret-key-must-be-strong}
  expiration: ${JWT_EXPIRATION:86400000}

# 安全配置
security:
  require-ssl: true